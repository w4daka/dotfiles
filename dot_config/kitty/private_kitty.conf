# ~/.config/kitty/kitty.conf

# ----------------------------------------
# Font
# 日本語フォントの設定 ref
# https://github.com/kovidgoyal/kitty/discussions/4007
# private memoにもログあり
# ----------------------------------------
font_family      JetBrainsMono Nerd Font Mono
symbol_map U+3000-U+30FF,U+4E00-U+9FFF,U+FF00-U+FFEF Noto Sans CJK JP
bold_font        auto
italic_font      Italic
bold_italic_font Italic
font_size        14.0

# ----------------------------------------
# Background / transparency
# ----------------------------------------
background_opacity 0.85

# 端末実行中に remote control 等で不透明度変更を許す
dynamic_background_opacity yes

# ----------------------------------------
# Scrollback
# ----------------------------------------
scrollback_lines 20000
scrollback_pager_history_size 128

# ----------------------------------------
# Clipboard
# ----------------------------------------
copy_on_select clipboard
clipboard_control write-primary write-clipboard no-append
# ----------------------------------------
# Scrollback -> Neovim overlay
# Ctrl+Shift+H で現在ウィンドウの screen + scrollback を
# overlay 上の nvim に stdin で流し込んで開く
# ----------------------------------------
map ctrl+shift+h launch --type=overlay --cwd=current --stdin-source=@screen_scrollback nvim --clean -n -R +'set clipboard=unnamedplus' +'setlocal buftype=nowrite bufhidden=wipe noswapfile nowrap nonumber norelativenumber' +'normal! G' -

# 任意: 標準の scrollback 検索
map ctrl+shift+/ search_scrollback

enabled_layouts horizontal
